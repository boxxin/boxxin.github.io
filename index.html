<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>boxxin</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:Inter,system-ui,sans-serif;
    background:#000;
}

.bg{
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.8)),
    url("https://media.discordapp.net/attachments/1516466209011273808/1516514114359398482/46pfb7h.gif?ex=6a32eb54&is=6a3199d4&hm=40c0814b205646b4afeea696b9f8283c732eb58a75e814a07fb4834477681323&=&width=747&height=422")
    center/cover no-repeat;

    filter:blur(15px);
    transform:scale(1.1);
    opacity:0;
    transition:2.5s;
}

.bg.show{
    opacity:1;
}


.card{
    z-index:2;
    width:440px;
    max-width:95vw;

    background:rgba(5,5,5,.85);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:35px;

    opacity:0;
    transform:scale(.75);
    transition:1.4s cubic-bezier(.16,1,.3,1);
}

.card.show{
    opacity:1;
    transform:scale(1);
}


.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
}


.username{
    text-align:center;
    color:white;
    margin-top:18px;
    font-size:32px;
}


.subtitle{
    text-align:center;
    color:#666;
    margin-top:5px;
}


.bio{
    text-align:center;
    color:#aaa;
    margin:20px auto;
    line-height:1.6;
}


.logo-links{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:16px;
}



.logo{
    width:34px;
    height:34px;

    border-radius:50%;
    overflow:hidden;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.25s;
}


.logo:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.1);
}



.logo img{
    width:60%;
    height:60%;

    object-fit:cover;
    border-radius:50%;
}


.music{
    display:flex;
    align-items:center;
    gap:8px;

    background:rgba(255,255,255,.05);
    padding:8px 10px;
    border-radius:10px;
}


.music button{
    background:none;
    border:none;
    color:white;
    font-size:14px;
    cursor:pointer;
}


.music input{
    flex:1;
    accent-color:white;
    height:14px;
}


.music span{
    color:white;
    font-size:10px;
    font-weight:500;
}


.song-info{
    min-width:80px;
}


.song-name{
    color:white;
    font-size:11px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


.song-sub{
    color:#777;
    font-size:9px;
    margin-top:1px;
}



#overlay{
    position:fixed;
    inset:0;

    background:#000;

    z-index:999;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:1.2s;
}


#overlay p{
    color:white;
    letter-spacing:.1em;
}

</style>

</head>


<body>


<div class="bg" id="bg"></div>


<div id="overlay">
    <p>click anywhere to enter</p>
</div>



<div class="card" id="card">


<img class="avatar"
src="https://raw.githubusercontent.com/boxxin/boxxin.github.io/main/49b4679579b9e66ba66a0dc65ea664cd.png">


<h1 class="username">
boxxin
</h1>


<p class="subtitle">
he/him
</p>


<p class="bio">
i genuinely dont know what to do with this site
</p>



<audio id="audio"
loop
src="https://raw.githubusercontent.com/boxxin/boxxin.github.io/main/Nias%20In%20Paris.mp3">
</audio>



<div class="logo-links">



<a class="logo"
href="https://github.com/boxxin"
target="_blank">

<img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png">

</a>





<a class="logo"
href="https://youtube.com/@boxxinn"
target="_blank">

<img src="https://www.youtube.com/favicon.ico">

</a>





<a class="logo"
href="https://tiktok.com/@boxxinnn"
target="_blank">

<img src="https://www.tiktok.com/favicon.ico">

</a>



</div>



<div class="music">


<div class="song-info">

<div class="song-name">
Neighbors In Paris
</div>

<div class="song-sub">
now playing
</div>

</div>


<button id="playbtn">
▶
</button>


<input
id="seek"
type="range"
min="0"
value="0"
step="0.1">


<span id="time">
0:00
</span>


</div>


</div>





<script>


const overlay = document.getElementById("overlay");
const bg = document.getElementById("bg");
const card = document.getElementById("card");

const audio = document.getElementById("audio");
const playbtn = document.getElementById("playbtn");

const seek = document.getElementById("seek");
const time = document.getElementById("time");



overlay.onclick = ()=>{

    audio.play().catch(()=>{});

    playbtn.textContent="⏸";

    overlay.style.opacity="0";

    bg.classList.add("show");


    setTimeout(()=>{
        card.classList.add("show");
    },1550);


    setTimeout(()=>{
        overlay.remove();
    },1900);

};





playbtn.onclick = ()=>{


if(audio.paused){

    audio.play();

    playbtn.textContent="⏸";

}else{

    audio.pause();

    playbtn.textContent="▶";

}


};





audio.addEventListener("loadedmetadata",()=>{

    seek.max = audio.duration;

});





audio.addEventListener("timeupdate",()=>{


seek.value = audio.currentTime;


let m = Math.floor(audio.currentTime / 60);

let s = Math.floor(audio.currentTime % 60)
.toString()
.padStart(2,"0");


time.textContent = `${m}:${s}`;


});




seek.oninput = ()=>{

    audio.currentTime = seek.value;

};



</script>


</body>

</html>
